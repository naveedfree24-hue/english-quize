<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clear English Quiz – Free English Grammar & Vocabulary Practice</title>
    <meta
      name="description"
      content="Practise English grammar, grow your vocabulary, and understand your mistakes with free interactive quizzes, clear explanations, and AI study tools."
    />
    <link rel="canonical" href="https://clearenglishquiz.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clear English Quiz" />
    <meta property="og:title" content="Clear English Quiz – Free English Grammar & Vocabulary Practice" />
    <meta
      property="og:description"
      content="Practise English grammar, grow your vocabulary, and understand your mistakes with free interactive quizzes, clear explanations, and AI study tools."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clear English Quiz – Free English Grammar & Vocabulary Practice" />
    <meta
      name="twitter:description"
      content="Practise English grammar, grow your vocabulary, and understand your mistakes with free interactive quizzes, clear explanations, and AI study tools."
    />

    <!-- Theme & Icons -->
    <meta name="theme-color" content="#245747" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Schema.org WebSite JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Clear English Quiz",
        "url": "https://clearenglishquiz.com/",
        "description": "Learn English. Test Yourself. Grow with Confidence. Free quizzes with detailed explanations.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://clearenglishquiz.com/quizzes/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body class="bg-[#FAF9F6] text-[#252B28] antialiased selection:bg-[#DCE9DF] selection:text-[#245747]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
